name: Back-ups ophalen (alleen lezen)

# Eenmalig: zet de thema-back-ups van de staging op de branch back-ups-staging. Verandert niets op de server.
on:
  push:
    branches: [herstel-back-up]

permissions:
  contents: write

jobs:
  ophalen:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: gnldm1102.siteground.biz
      SSH_PORT: 18765
      SSH_USER: u2594-ag8zh8mdhogx
    steps:
      - uses: actions/checkout@v5
      - name: SSH-sleutel klaarzetten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/sleutel
          chmod 600 ~/.ssh/sleutel
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Back-ups ophalen en uitpakken
        run: |
          mkdir -p /tmp/bu
          scp -i ~/.ssh/sleutel -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:thema-backups/*.tgz" /tmp/bu/
          git switch --orphan back-ups-staging
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          ssh -i ~/.ssh/sleutel -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "ls -la --time-style=full-iso ~/thema-backups/" > lijst.txt
          for f in /tmp/bu/*.tgz; do
            n=$(basename "$f" .tgz); mkdir -p "$n"; tar xzf "$f" -C "$n"
            echo "$n $(grep -m1 Version "$n/lekker-geel/style.css")" >> versies.txt
          done
          cat versies.txt
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Thema-back-ups van de staging"
          git push -f origin back-ups-staging
